name: Android Debug Build
on:
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Configure unified debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Configured unified debug keystore from GitHub Actions Secret."
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret is not set; generating ephemeral CI debug keystore (installing over a differently signed APK via USB requires uninstalling the old build first)."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Wrote app/google-services.json from the GOOGLE_SERVICES_JSON secret."
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret is not set; the APK will not connect to Firebase and the project-config test is skipped."
          fi
      - name: Run Captain unit tests
        timeout-minutes: 80
        run: gradle --no-daemon --console=plain --info :app:testDebugUnitTest
      - name: Upload unit test reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
      - name: Build Captain debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
